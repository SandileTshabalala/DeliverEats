server {
    listen 80;
    server_name localhost;

    # FastAPI REST API + WebSockets.
    # NOTE: no trailing slash on proxy_pass, so the path is forwarded unchanged.
    # The API routes all live under /api/v1/..., including the WebSockets at
    # /api/v1/ws/orders/..., so this single block has to handle the upgrade too.
    # (With "proxy_pass http://server:8000/;" nginx stripped "/api/" and every
    # request reached FastAPI as /v1/... -> 404.)
    location /api/ {
        proxy_pass http://server:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # React Vite dev server
    location / {
        proxy_pass http://client:5173;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}

# "Connection: upgrade" only for WebSocket requests, keep-alive otherwise
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}
