services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile.dev
    command: uvicorn app.main:app --reload --host 0.0.0.0 --port 8000
    env_file: ./server/.env.dev
    volumes:
      - ./server:/app
    ports:
      - "8000:8000"
    depends_on:
      - redis

  worker:
    build:
      context: ./server
      dockerfile: Dockerfile.dev
    # -Q: the queue the tasks are routed to.  -B: also run the scheduler (beat)
    # that cancels unpaid / stale orders every minute. Run only ONE container with -B.
    command: celery -A app.workers.worker worker -B -Q lvovo_queue -l info
    env_file: ./server/.env.dev
    volumes:
      - ./server:/app
    depends_on:
      - redis

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  client:
    build:
      context: ./client
      dockerfile: Dockerfile.dev
    env_file:
      - ./client/.env.dev
    environment:
      VITE_USE_POLLING: "true"
    volumes:
      - ./client:/app
      - client_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - server  
  

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
    - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - server
      - client
      
volumes:
  client_node_modules: