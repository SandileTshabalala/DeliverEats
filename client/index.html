<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' http: https: data: blob: 'unsafe-inline' 'unsafe-eval'; frame-src 'self' https://js.stripe.com https://hooks.stripe.com; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://js.stripe.com https://maps.googleapis.com blob:; img-src 'self' data: https: blob:; connect-src 'self' http: https: ws: wss:;" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Deliver Eats | Local food, delivered</title>
    <meta name="description" content="Order from the shisanyamas, kota spots and kitchens in your area. Pay cash, card or online, and follow your delivery to your door." />
    <meta name="theme-color" content="#110f0d" />
    <script>
      // Apply the saved light / dark choice before the page draws, so it never flashes the wrong theme
      (function () {
        var choice = 'system';
        try { choice = localStorage.getItem('theme') || 'system'; } catch (e) {}
        var light = choice === 'light' || (choice === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches);
        document.documentElement.dataset.theme = light ? 'light' : 'dark';
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
